# Settings for a public, read-only deployment (the Docker image activates this profile).
# The models stay offline, so nothing here can spend money on a provider.
lookalike.ai.provider=offline

# Strangers must not change stored data.
lookalike.feedback.endpoint.enabled=false
lookalike.ratelimit.enabled=true
lookalike.seed.enabled=true

# A short cache lifetime keeps arbitrary submitted text from piling up in a small Redis.
lookalike.cache.ttl=PT1H

# The cache fails open, so a Redis outage should not turn the health check red.
management.health.redis.enabled=false

# Use the client address that a reverse proxy forwards, when the proxy is a trusted one.
server.forward-headers-strategy=native

# Small footprint for a 512 MB container.
server.tomcat.threads.max=20
server.tomcat.max-connections=200
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
