spring.application.name=campaign-lookalike-rag
management.endpoints.web.exposure.include=health,info
server.port=${PORT:8080}

# Postgres with pgvector. Defaults match docker-compose.yml. A hosted database usually wants
# POSTGRES_SSLMODE=require. Flyway can use a different (direct) connection through the standard
# SPRING_FLYWAY_URL, SPRING_FLYWAY_USER and SPRING_FLYWAY_PASSWORD variables.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:lookalike}?sslmode=${POSTGRES_SSLMODE:prefer}
spring.datasource.username=${POSTGRES_USER:lookalike}
spring.datasource.password=${POSTGRES_PASSWORD:lookalike}

# Redis only holds the embedding cache, so it gets short timeouts: an unreachable host must not
# hold up a request for the 60 second default.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=5s

# Spring AI vector store. Dimensions must equal the embedding model's output size.
lookalike.ai.provider=offline
lookalike.ai.embedding-dimensions=256
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.id-type=TEXT
spring.ai.vectorstore.pgvector.dimensions=${lookalike.ai.embedding-dimensions}
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# Provider auto-configuration stays off until the openai profile is active.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

lookalike.cache.enabled=true
lookalike.cache.ttl=PT24H

# Reranking: lexical (offline cross scorer), none, or model (needs the openai profile).
lookalike.rerank.mode=lexical
lookalike.rerank.retrieval-weight=0.4
lookalike.rerank.cross-weight=0.6

# How many times the ranker may be asked before missing slots are filled from reranked order.
lookalike.ranking.max-attempts=2

# Feedback: re-weight retrieval scores with recorded outcomes. Off by default.
lookalike.feedback.reweight.enabled=false
lookalike.feedback.reweight.strength=0.05

# POST /v1/outcomes writes to the database, so a public deployment can switch it off.
lookalike.feedback.endpoint.enabled=true

# Per-IP request limit on /v1/**, in memory. Off unless the demo profile turns it on.
lookalike.ratelimit.enabled=false
lookalike.ratelimit.per-minute=30

# Loads lookalike.seed.path into an empty campaigns table at startup. Off unless the demo profile turns it on.
lookalike.seed.enabled=false
lookalike.seed.path=data/sample_campaigns.csv
