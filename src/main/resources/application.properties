spring.application.name=campaign-lookalike-rag
management.endpoints.web.exposure.include=health,info

# Postgres with pgvector. Defaults match docker-compose.yml.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:lookalike}
spring.datasource.username=${POSTGRES_USER:lookalike}
spring.datasource.password=${POSTGRES_PASSWORD:lookalike}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Spring AI vector store. Dimensions must equal the embedding model's output size.
lookalike.ai.provider=offline
lookalike.ai.embedding-dimensions=256
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.id-type=TEXT
spring.ai.vectorstore.pgvector.dimensions=${lookalike.ai.embedding-dimensions}
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# Provider auto-configuration stays off until the openai profile is active.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

lookalike.cache.enabled=true
lookalike.cache.ttl=PT24H

# Reranking: lexical (offline cross scorer), none, or model (needs the openai profile).
lookalike.rerank.mode=lexical
lookalike.rerank.retrieval-weight=0.4
lookalike.rerank.cross-weight=0.6

# How many times the ranker may be asked before missing slots are filled from reranked order.
lookalike.ranking.max-attempts=2

# Feedback: re-weight retrieval scores with recorded outcomes. Off by default.
lookalike.feedback.reweight.enabled=false
lookalike.feedback.reweight.strength=0.25
