# Real provider through Spring AI's OpenAI client. Works with any OpenAI-compatible endpoint,
# including a local Ollama server (OPENAI_BASE_URL=http://localhost:11434, no real key needed).
# The vector table size must match the embedding model, so also set LOOKALIKE_AI_EMBEDDING_DIMENSIONS
# and re-ingest after changing models.
lookalike.ai.provider=openai
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.options.dimensions=${lookalike.ai.embedding-dimensions}
